[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodoist"
version = "0.1.0"
description = "Slim Todoist MCP & mini-backend for Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2,<5",
    "httpx>=0.28,<1.0",
    "mcp>=2.3,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "starlette>=1.0",
    "tzdata>=2024.1",
    "uvicorn>=0.40",
]

[project.scripts]
autodoist = "autodoist.server:main"
autodoist-sync = "autodoist.sync_worker:main"

[dependency-groups]
dev = [
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "pyrefly>=0.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autodoist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.12"
