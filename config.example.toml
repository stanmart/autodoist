# Non-secret configuration for autodoist.
# Copy to config.toml and customize. Override path via AUTODOIST_CONFIG env var.

[storage]
db_path = "data/autodoist.db"

[auth]
mcp_base_url = "https://todoist-mcp.example.com"
oidc_issuer = "https://id.example.com"
# Optional JWKS URL override (defaults to <oidc_issuer>/.well-known/jwks.json)
# oidc_jwks_uri = ""
# Asymmetric JWT signing algorithm (e.g. RS256, ES256)
# jwt_algorithm = "RS256"
# Required expected JWT audience when AUTH_DISABLED=false (string or list of strings)
jwt_audience = "https://todoist-mcp.example.com"
# OIDC `sub` user IDs allowed to access the MCP server
allowed_user_subs = []

[sync]
# Periodic background sync interval in minutes (0 disables background sync)
interval_minutes = 30

[rules]
allowed_projects = ["Inbox", "Personal", "Household"]
capture_projects = ["Personal", "Household"]
allowed_labels = ["errands", "home", "admin", "15min", "evening", "weekend", "someday"]
synergy_labels = ["errands", "home", "admin", "15min"]
# Optional: tag every task created through the MCP until a human confirms it. The label
# must also be in allowed_labels. Leave unset to let the assistant work unattended.
# review_label = "review"
# Tasks with this label are hidden from get_tasks unless requested by label
someday_label = "someday"
# Project whose tasks always count as needing triage
inbox_project = "Inbox"
# IANA timezone used for overdue date comparisons (e.g. Europe/Budapest)
timezone = "UTC"

# What each label means; sent to the MCP client in the server instructions
[rules.label_descriptions]
errands = "Needs leaving the house"
home = "Done at home"
admin = "Paperwork, calls, and online chores"
15min = "Takes 15 minutes or less"

# Routine slots: recurring times for working through tasks. The name is also the label
# that assigns a task to the slot; the times themselves live in your calendar.
[[rules.routines]]
name = "evening"
purpose = "Short, urgent tasks on weekday evenings"
capacity = "30 minutes, at most 3 tasks"
# Also pull in any task due within this many days, whatever its label
due_within_days = 1

[[rules.routines]]
name = "weekend"
purpose = "Weekly batch of everything collected, plus the weekly review"
capacity = "2 hours"
