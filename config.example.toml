# Non-secret configuration for autodoist.
# Copy to config.toml and customize. Override path via AUTODOIST_CONFIG env var.

[storage]
db_path = "data/autodoist.db"

[auth]
mcp_base_url = "https://todoist-mcp.example.com"
oidc_issuer = "https://id.example.com"
# Optional JWKS URL override (defaults to <oidc_issuer>/.well-known/jwks.json)
# oidc_jwks_uri = ""
# Asymmetric JWT signing algorithm (e.g. RS256, ES256)
# jwt_algorithm = "RS256"
# Required expected JWT audience when AUTH_DISABLED=false (string or list of strings)
jwt_audience = "https://todoist-mcp.example.com"
# OIDC `sub` user IDs allowed to access the MCP server
allowed_user_subs = []

[sync]
# Periodic background sync interval in minutes (0 disables background sync)
interval_minutes = 30

[rules]
allowed_projects = ["Inbox", "Personal", "Household"]
capture_projects = ["Personal", "Household"]
allowed_labels = ["errands", "home", "admin", "15min", "review"]
synergy_labels = ["errands", "home", "admin", "15min"]
review_label = "review"
# IANA timezone used for overdue date comparisons (e.g. Europe/Budapest)
timezone = "UTC"
